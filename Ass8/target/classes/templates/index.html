<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Insight Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text: #f1f5f9;
            --secondary: #94a3b8;
            --positive: #4ade80;
            --negative: #f87171;
            --neutral: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            overflow-x: hidden;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 20s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--secondary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            color: white;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .feedback-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 1.25rem;
            border-left: 4px solid var(--accent);
        }

        .sentiment-Positive { border-left-color: var(--positive); }
        .sentiment-Negative { border-left-color: var(--negative); }
        .sentiment-Neutral { border-left-color: var(--neutral); }

        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .item-name { font-weight: 600; }
        .item-topic { 
            font-size: 0.8rem; 
            background: rgba(56, 189, 248, 0.1); 
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
        }

        .item-comments {
            color: var(--secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chart-container {
            margin-top: 2rem;
            height: 300px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            margin-left: 0.5rem;
        }

        .badge-pos { background: rgba(74, 222, 128, 0.2); color: var(--positive); }
        .badge-neg { background: rgba(248, 113, 113, 0.2); color: var(--negative); }
    </style>
</head>
<body>
    <div class="container">
        <div class="ticker-wrap">
            <div class="ticker">
                <span class="ticker-item">🔥 Trending Topic: UI/UX Design</span>
                <span class="ticker-item">⚡ System Performance: Stable</span>
                <span class="ticker-item">📈 Total Feedback: [[${#lists.size(feedbacks)}]]</span>
                <span class="ticker-item">⭐ Average Rating: 4.8/5</span>
            </div>
        </div>
        <header>
            <h1>Customer Insights</h1>
            <p>Analyzing feedback to improve our service</p>
        </header>

        <div class="grid">
            <!-- Feedback Form -->
            <div class="card">
                <h2 style="margin-bottom: 1.5rem">Submit Feedback</h2>
                <form th:action="@{/submit}" th:object="${newFeedback}" method="post">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{customerName}" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label>Topic</label>
                        <select th:field="*{topic}">
                            <option value="UI/UX">UI/UX Design</option>
                            <option value="Performance">Performance</option>
                            <option value="Features">New Features</option>
                            <option value="Support">Customer Support</option>
                            <option value="Pricing">Pricing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rating (1-5)</label>
                        <input type="number" th:field="*{rating}" min="1" max="5" required>
                    </div>
                    <div class="form-group">
                        <label>Comments</label>
                        <textarea th:field="*{comments}" rows="4" placeholder="Tell us more..."></textarea>
                    </div>
                    <button type="submit">Send Feedback</button>
                </form>

                <div class="chart-container">
                    <canvas id="topicChart"></canvas>
                </div>
                
                <a th:href="@{/export}" style="text-decoration: none;">
                    <button type="button" style="margin-top: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--secondary); color: var(--secondary);">
                        📊 Export to CSV
                    </button>
                </a>
            </div>

            <!-- Feedback Feed -->
            <div class="card">
                <h2 style="margin-bottom: 1.5rem">Recent Feed</h2>
                <div class="feedback-list">
                    <div th:each="f : ${feedbacks}" th:class="'feedback-item sentiment-' + ${f.getSentiment()}">
                        <div class="item-header">
                            <div>
                                <span class="item-name" th:text="${f.customerName}">Name</span>
                                <span th:class="${f.rating >= 4 ? 'badge badge-pos' : (f.rating <= 2 ? 'badge badge-neg' : 'badge')}" 
                                      th:text="${f.getSentiment()}">Sentiment</span>
                            </div>
                            <span class="item-topic" th:text="${f.topic}">Topic</span>
                        </div>
                        <p class="item-comments" th:text="${f.comments}">Comments</p>
                    </div>
                    <div th:if="${#lists.isEmpty(feedbacks)}" style="text-align: center; color: var(--secondary); padding: 2rem;">
                        No feedback yet. Be the first!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /* Chart.js for Insights */
        const topicData = /*[[${topics}]]*/ {};
        const labels = Object.keys(topicData);
        const values = Object.values(topicData);

        const ctx = document.getElementById('topicChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Feedback by Topic',
                    data: values,
                    backgroundColor: [
                        '#38bdf8', '#818cf8', '#c084fc', '#fb7185', '#fbbf24'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#94a3b8' } }
                },
                cutout: '70%'
            }
        });
    </script>
</body>
</html>
