<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Resorts | Booking Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <meta name="description" content="Luxury resort reservation management system.">
</head>
<body>
    <div class="overlay"></div>
    
    <main class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon">L</div>
                <h1>Lumina<span>Resorts</span></h1>
            </div>
            <nav>
                <ul>
                    <li class="active" data-view="dashboard">
                        <span class="icon">📊</span> Dashboard
                    </li>
                    <li data-view="bookings">
                        <span class="icon">📅</span> Reservations
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>System v1.2.0</p>
            </div>
        </aside>

        <section class="main-content">
            <header class="top-bar">
                <div class="welcome">
                    <h2>Reservation Dashboard</h2>
                    <p id="current-date">Fetching data...</p>
                </div>
                <div class="actions">
                    <button id="open-modal-btn" class="btn btn-primary">
                        <span class="plus">+</span> New Reservation
                    </button>
                </div>
            </header>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="label">Total Bookings</span>
                        <h3 id="total-bookings-count">0</h3>
                    </div>
                    <div class="stat-icon blue">🏨</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="label">Available Rooms</span>
                        <h3>24</h3>
                    </div>
                    <div class="stat-icon gold">✨</div>
                </div>
            </div>

            <div class="content-section">
                <div class="section-header">
                    <h3>Recent Reservations</h3>
                    <div class="table-actions">
                        <button id="refresh-table" class="btn btn-icon" title="Refresh">🔄</button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="reservations-table">
                        <thead>
                            <tr>
                                <th>Guest Name</th>
                                <th>Room Type</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reservations-list">
                            <!-- Rows will be injected here -->
                            <tr>
                                <td colspan="5" class="loading-state">Syncing with server...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for New/Edit Reservation -->
    <div id="booking-modal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="modal-title">New Reservation</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="booking-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="customerName">Guest Full Name</label>
                    <input type="text" id="customerName" placeholder="e.g. Alexander Pierce" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="checkInDate">Check-In</label>
                        <input type="date" id="checkInDate" required>
                    </div>
                    <div class="form-group">
                        <label for="checkOutDate">Check-Out</label>
                        <input type="date" id="checkOutDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="roomType">Room Category</label>
                    <select id="roomType" required>
                        <option value="" disabled selected>Select a room...</option>
                        <option value="Deluxe Suite">Deluxe Suite</option>
                        <option value="Ocean View">Ocean View</option>
                        <option value="Presidential Villa">Presidential Villa</option>
                        <option value="Executive Loft">Executive Loft</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">Operation successful</div>

    <script src="script.js"></script>
</body>
</html>
